name: Daily Disclosure Update

on:
  schedule:
    # Run daily at 6 AM UTC (1 AM EST)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger

# One database, one writer at a time.
#
# `daily-update` and `rebuild` both write to the same production database, and
# nothing kept them apart. Measured: the 11:18 cron overlapped rebuild runs 12
# and 13 in their entirety -- six hours of two workflows ingesting and analysing
# concurrently -- and both run `cli analyze` against the same `anomalies` table.
#
# Two costs, one of them already paid. Findings appeared on the site that had to
# be traced by timestamp to work out which run produced them: rebuild 13's parse
# created the Senate transactions and the cron's analysis step, started
# thirty-six minutes later, wrote the findings. Nothing was wrong with the data,
# but nobody could say where it came from without reading four job logs.
#
# The second is not yet paid and is worse. `persist_anomalies` deduplicates with
# a SELECT followed by an INSERT; two analysis passes interleaving can both see
# "not present" and both insert.
#
# The group name is shared between the two workflows on purpose -- that is the
# entire mechanism. `cancel-in-progress: false` because a nightly run halfway
# through an ingest should finish, not be killed by somebody dispatching a
# rebuild.
concurrency:
  group: honest-congress-production-database
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  update-disclosures:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Every scheduled run from at least 2026-09-05 to 2026-09-12 failed here
      # with "Could not parse SQLAlchemy URL", because RAILWAY_DATABASE_URL is
      # not configured and DATABASE_URL arrived empty. A stack trace twenty
      # frames deep is a bad way to learn that a secret is missing, so this
      # says it in one line instead.
      - name: Check the database secret is configured
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::RAILWAY_DATABASE_URL is not set. Add it under Settings -> Secrets and variables -> Actions. Until then this workflow cannot reach the database and every run fails."
            exit 1
          fi
          echo "DATABASE_URL is set (${#DATABASE_URL} characters)."

      # We point at Railway's external Postgres URL so each daily run
      # ingests into the *same* database the deployed app reads from.
      # Configure the secret in repo settings → Secrets → Actions.
      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: python -m src.cli init

      # `cli ingest` drives IngestionOrchestrator, which covers House Clerk
      # disclosures and the member roster.
      - name: Ingest disclosure data
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          CONGRESS_GOV_API_KEY: ${{ secrets.CONGRESS_GOV_API_KEY }}
        run: python -m src.cli ingest

      - name: Sync committee assignments
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: python -m src.cli sync-committees

      # The three Tier-2 feeds. Each is a separate official source, and each is
      # allowed to fail without stopping the run: a throttled FEC cycle or an
      # LDA outage must not block the analysis of data already ingested. The
      # `stats` command reports any detector left with an empty source table,
      # so a silent zero here still surfaces.
      - name: Ingest federal contract awards
        id: contracts
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL || 'contact@example.com' }}
        run: python -m src.cli ingest-contracts

      # FEC allows 1,000 requests/hour and a full cycle costs more than that,
      # so the run is capped and resumes tomorrow where it stopped.
      - name: Ingest corporate PAC donations
        id: donations
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL || 'contact@example.com' }}
        run: python -m src.cli ingest-donations --cycle 2024 --max-requests 800

      # LDA_API_KEY is optional: without it the ingester paces itself down to
      # the anonymous rate rather than failing.
      - name: Ingest lobbying disclosures
        id: lobbying
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL || 'contact@example.com' }}
        run: python -m src.cli ingest-lobbying --year 2024

      # Sector classification for every traded ticker. Must run before analyze:
      # three detectors join a bill or a committee remit to a sector, and
      # without this they see only the ~70 large caps in the hand-written list.
      # Incremental -- only tickers not already cached.
      - name: Sync SEC industry codes
        id: industries
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL || 'contact@example.com' }}
        run: python -m src.cli sync-industries

      # The join to legislative action. `--sponsored-only` because cosponsorship
      # is ~20x more voluminous (one member: 71 sponsored, 1,562 cosponsored)
      # and no detector reads it yet -- fetching it nightly would spend roughly
      # ten thousand requests on data nothing looks at. Drop the flag for a
      # backfill when a cosponsorship detector exists.
      - name: Ingest bill sponsorship and committee referrals
        id: bills
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          CONGRESS_GOV_API_KEY: ${{ secrets.CONGRESS_GOV_API_KEY }}
        run: python -m src.cli ingest-bills --sponsored-only

      # Deobligations used to count as awards, so contract front-run findings
      # were published describing a member as buying before a company "was
      # awarded a federal contract ($-1,882,437,667)". `award_action_criteria`
      # stops new ones; `persist_anomalies` only ever inserts, so this is what
      # removes the ones already written. Runs before analyze so the same pass
      # that clears them re-derives whatever is still justified.
      - name: Drop contract findings no award supports
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: python -m src.cli purge-non-awards

      - name: Run anomaly analysis
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: python -m src.cli analyze

      # Names any detector whose source table is empty, so "no findings" stays
      # distinguishable from "no data" in the run log.
      - name: Report detector coverage
        if: always()
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: |
          echo "## Disclosure Update Summary - $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # A feed that DIED shows a green tick, because every step above
          # carries continue-on-error. That is the right default -- a throttled
          # source must not stop the nightly analysis -- but on this workflow it
          # is worse than on the manual one: nobody is watching a 06:00 cron, so
          # a feed can stay dead for weeks while the job stays green. A single
          # Cloudflare 522 did exactly that to the sponsorship ingest.
          FAILED=""
          for step in \
            "contracts:${{ steps.contracts.outcome }}" \
            "donations:${{ steps.donations.outcome }}" \
            "lobbying:${{ steps.lobbying.outcome }}" \
            "industries:${{ steps.industries.outcome }}" \
            "bills:${{ steps.bills.outcome }}"; do
            if [ "${step#*:}" = "failure" ]; then FAILED="$FAILED ${step%%:*}"; fi
          done
          if [ -n "$FAILED" ]; then
            echo "### ⚠️ Feeds that FAILED despite the green tick" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`$FAILED\` — their data is missing or partial. Open the step log before trusting any detector that reads from them." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
          python -m src.cli stats >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Daily disclosure update failed. Check logs for details."
