# Railway service configuration. Railway auto-detects this file and uses
# it instead of Nixpacks defaults.
#
# Required Railway env vars:
#   DATABASE_URL       — provided automatically when you attach Postgres
#   ADMIN_PASSWORD     — strong random string (see /api/anomalies/admin/login)
#   ALLOWED_ORIGINS    — your dashboard domain(s); comma-separated
#   ENV=production     — enables production-mode validation
# Optional:
#   LATE_FILING_MIN_DAYS (default 60), LATE_FILING_MIN_AMOUNT_USD (default 50000)
#
# The ingestion API keys are deliberately NOT listed here, and setting them on
# Railway does nothing.
#
# Two machines run this project. Railway runs the web service, which serves what
# is already in the database. The data pipeline -- `cli ingest`, `parse`,
# `analyze` and every Tier-2 feed -- runs as GitHub Actions steps, so
# CONGRESS_GOV_API_KEY, FEC_API_KEY, LDA_API_KEY and SEC_CONTACT_EMAIL belong in
# the repository's Actions secrets. Nothing in the deployed service reads them:
# no route under src/api/ references those settings or the ingesters that use
# them, and the one admin endpoint that does sync anything (`sync-all-members`)
# reads the keyless congress-legislators dataset. This note previously claimed
# they mattered "for the admin sync endpoints", which was not true.
#
# RAILWAY_DATABASE_URL looks inverted for the same reason and is not: it lives in
# GitHub because the runner writes into Railway's database from outside.
#
# QUIVERQUANT_API_KEY was listed here and no longer exists — that vendor was
# replaced by the official sources above.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Run schema migrations before each deploy — keeps the prod schema in lock
# step with the code that's about to start serving traffic.
preDeployCommand = "alembic upgrade head"
# No startCommand: Railway runs Dockerfile-defined startCommands in exec form,
# which means $PORT would be passed to uvicorn as the literal string "$PORT"
# (uvicorn then crashes with "'$PORT' is not a valid integer"). The
# Dockerfile's CMD wraps the same command in `sh -c` so the shell expands
# $PORT correctly — let it handle startup.
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
