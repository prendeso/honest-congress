name: Maintenance

# Run one remediation command against the production database, and nothing else.
#
# The purge commands delete published rows the current code would not write.
# Until now the only way to run one was to run a whole pipeline: in
# `daily-update.yml` the purges sit at step 21 of 23, behind an ingest, a
# 400-filing parse and every feed. Three seconds of DELETE cost three and a half
# hours, and the `analyze` that follows moves the whole corpus as a side effect.
#
# So a purge that needed running out of band did not get run. That is the exact
# failure this project keeps repeating: `purge-stale-wording` was written,
# tested, merged and wired into nothing, and 425 findings were served for three
# pipeline runs with text no detector could write.
#
# Measured the day this was added: rebuild #15 finished carrying the corrected
# `trade_clustering` detector but not the purge entry for the wording it
# replaced, so 169 findings were published beside their own corrections --
# Thom Tillis served simultaneously as "7 in a row over 0 days" and "14 in a row
# within a short period", under his own name.
#
# This workflow does not analyse. Deleting the rows is the whole job; the next
# scheduled nightly re-derives each finding with the corrected wording.

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Which remediation command to run'
        required: true
        default: purge-stale-wording
        type: choice
        options:
          - purge-stale-wording
          - purge-disabled
          - purge-non-awards
          - repair-house-attribution
          - move-filing
          - reparse-annuals
      dry_run:
        description: 'Report what would change without writing it. Leave ON first.'
        required: true
        default: true
        type: boolean
      years:
        description: 'Filing years, space separated. Only repair-house-attribution reads this.'
        required: false
        default: '2024 2025 2026'
        type: string
      document_id:
        description: "The Clerk's DocID. Only move-filing reads this."
        required: false
        default: ''
        type: string
      to_bioguide:
        description: 'Bioguide ID of the member who filed it. Only move-filing reads this.'
        required: false
        default: ''
        type: string
      limit:
        description: 'How many filings to re-read. Only reparse-annuals reads this. Runs are resumable: each pass takes the least-recently-touched first.'
        required: false
        default: '400'
        type: string
      min_confidence:
        description: 'Only reparse-annuals. Blank re-reads the whole queue in order; a number (0-1) re-reads only filings scored BELOW it, which is the cleanup pass after a parser fix.'
        required: false
        default: ''
        type: string

# One database, one writer at a time. `daily-update` and `rebuild` share this
# group because they both write to the production `anomalies` table; a purge
# deleting rows while an `analyze` is inserting them is the same hazard, so it
# waits its turn rather than racing the 06:00 cron.
concurrency:
  group: honest-congress-production-database
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  maintenance:
    runs-on: ubuntu-latest
    # The purges are seconds of SQL. `repair-house-attribution` re-reads the
    # Clerk's whole XML index for every year first, over the network, so the
    # ceiling is sized for that rather than for the fast case.
    #
    # `reparse-annuals` downloads and re-reads one filing at a time with a
    # delay, so it is sized by `limit` rather than by anything here. 400 filings
    # at roughly two seconds each is about fifteen minutes; the ceiling leaves
    # room for a larger batch without letting a stuck run hold the database
    # lock all day.
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # A stack trace twenty frames deep is a bad way to learn that a secret is
      # missing. Same guard as the other two pipelines, for the same reason.
      - name: Check the database secret is configured
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::RAILWAY_DATABASE_URL is not set. Add it under Settings -> Secrets and variables -> Actions. Until then this workflow cannot reach the database."
            exit 1
          fi
          echo "DATABASE_URL is set (${#DATABASE_URL} characters)."

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: python -m src.cli init

      # The two conventions are opposite, and getting this wrong is not a
      # cosmetic failure -- it writes to production while reporting that it is
      # only looking.
      #
      #   the purges        apply by default, and --dry-run only previews
      #   repair-house-...  previews by default, and --apply writes
      #
      # The first version of this file asserted that only `purge-stale-wording`
      # took `--dry-run` and warned that the other two "have no --dry-run"
      # before running them for real. That was simply false -- all three
      # declare it -- so a dry run of `purge-disabled` or `purge-non-awards`
      # would have deleted rows while printing that it was previewing. Nobody
      # dispatched those paths before it was caught, but the safe default was
      # defeated for two of the three commands it was supposed to protect.
      #
      # So the mapping is written out per command rather than inferred, and
      # `tests/test_purges_are_wired_in.py` checks each entry against the
      # command's real argparse parser. An unsupported flag aborts the run,
      # and a missing one writes when it should not; both are caught there.
      - name: Run the remediation command
        id: purge
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: |
          FLAGS=""
          COMMAND=""
          case "${{ inputs.command }}" in
            repair-house-attribution)
              FLAGS="--years ${{ inputs.years }}"
              if [ "${{ inputs.dry_run }}" != "true" ]; then
                FLAGS="$FLAGS --apply"
              fi
              ;;
            move-filing)
              if [ -z "${{ inputs.document_id }}" ] || [ -z "${{ inputs.to_bioguide }}" ]; then
                echo "::error::move-filing needs both document_id and to_bioguide. It moves ONE named filing onto ONE named member and will not guess either."
                exit 1
              fi
              FLAGS="--document-id ${{ inputs.document_id }} --to-bioguide ${{ inputs.to_bioguide }}"
              if [ "${{ inputs.dry_run }}" != "true" ]; then
                FLAGS="$FLAGS --apply"
              fi
              ;;
            purge-stale-wording|purge-disabled|purge-non-awards)
              if [ "${{ inputs.dry_run }}" = "true" ]; then
                FLAGS="--dry-run"
              fi
              ;;
            reparse-annuals)
              # Not a purge and not a repair: it re-reads annual filings from
              # the Clerk and from eFD and replaces what the old parser stored.
              # It is here because the alternative is `daily-update.yml`, which
              # reaches a parse at step 4 of 23 and only for filings it has
              # never read.
              #
              # The command is `parse`, so the flags below are its own.
              # `--annual-only` keeps the run off PTRs, which none of the
              # parser changes touched. `--reparse` is what makes it re-read a
              # filing already marked parsed -- and `--min-confidence` cannot
              # substitute for it, because every House annual is stored at 1.0
              # and that WAS the defect.
              COMMAND="parse"
              FLAGS="--reparse --annual-only --limit ${{ inputs.limit }}"
              # The cleanup pass after a parser fix. `--min-confidence` is
              # evaluated BEFORE the `--reparse` check in
              # `_disclosures_to_parse`, so passing both re-reads exactly the
              # filings stored below the threshold rather than the whole queue.
              #
              # It is needed because a fix can land mid-campaign -- #86 did --
              # and because the campaign's own scores say which filings still
              # read badly. That is the point of an honest `parse_confidence`:
              # the instrument names the work.
              if [ -n "${{ inputs.min_confidence }}" ]; then
                FLAGS="$FLAGS --min-confidence ${{ inputs.min_confidence }}"
              fi
              if [ "${{ inputs.dry_run }}" = "true" ]; then
                FLAGS="$FLAGS --dry-run"
              fi
              ;;
            *)
              echo "::error::Unknown command '${{ inputs.command }}'. Refusing to guess whether it writes."
              exit 1
              ;;
          esac
          COMMAND="${COMMAND:-${{ inputs.command }}}"
          echo "Running: src.cli $COMMAND $FLAGS"
          python -m src.cli $COMMAND $FLAGS

      - name: Say what was run
        if: always()
        run: |
          {
            echo "### Maintenance"
            echo ""
            echo "- command: \`${{ inputs.command }}\`"
            echo "- dry run: \`${{ inputs.dry_run }}\`"
            echo "- result: \`${{ steps.purge.outcome }}\`"
            echo ""
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "Nothing was written. Re-dispatch with dry run OFF to apply."
            elif [ "${{ inputs.command }}" = "reparse-annuals" ]; then
              echo "Annual filings were re-read and their assets and liabilities replaced. Published net worth will have RISEN -- the old reader captured about half of Schedule A, and the half it lost was the large half."
              echo ""
              echo "Runs are resumable: each pass takes the least-recently-touched filings first, so dispatch again to continue. Findings are not re-derived here; the next scheduled nightly does that."
            elif [ "${{ inputs.command }}" = "repair-house-attribution" ] || [ "${{ inputs.command }}" = "move-filing" ]; then
              echo "Filings were moved onto the correct member. Transactions, assets and liabilities hang off \`disclosure_id\` and followed them."
              echo ""
              echo "Anomalies did NOT: they are member-level and derived, so the findings stay on the old member until the next \`analyze\`."
            else
              echo "Rows were deleted. The next scheduled nightly re-derives each finding with the corrected wording."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
