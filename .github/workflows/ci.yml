name: CI

on:
  pull_request:
  push:
    branches: [main, master]

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e .[dev]
      # Mypy runs in non-strict mode for now — see [tool.mypy] in pyproject.
      # Failures here are aspirational, not blocking, until we annotate more.
      - run: mypy src
        continue-on-error: true

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e .[dev]
      - run: pytest --cov=src --cov-report=term-missing

  # The whole suite runs on SQLite and never invokes alembic, so neither the
  # migration chain nor any Postgres-specific DDL had a single check on it --
  # in a project whose production database is Postgres and whose deploy runs
  # `alembic upgrade head` before every release.
  #
  # Two bugs shipped through that gap and blocked every deployment:
  #   * e5f1a93c284d re-declared the `chamber` enum the baseline already
  #     created, so `CREATE TYPE chamber` ran twice -- fatal on Postgres,
  #     invisible on SQLite, which has no native enum types.
  #   * the baseline's autogenerated downgrade dropped its tables but not
  #     those types, so `downgrade base` then `upgrade head` -- which is
  #     exactly `cli reset --yes` -- emptied the database and then could not
  #     rebuild it.
  #
  # Both only appear on an INCREMENTAL upgrade. SQLAlchemy memoises enum
  # creation per invocation, so running the chain end to end from empty passes
  # either way; it is the second, separate `alembic upgrade` against an
  # already-migrated database that breaks. Hence step 2 below, which is the
  # shape every real deploy has.
  migrations:
    name: Migrations (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      PG_BASE: postgresql+psycopg://postgres:postgres@localhost:5432

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e .[dev]

      - name: 1. Apply the whole chain to an empty database
        env:
          DATABASE_URL: ${{ env.PG_BASE }}/postgres
        run: |
          python -m alembic upgrade head
          test "$(python -m alembic current 2>/dev/null | tail -1 | cut -d' ' -f1)" = "$(python -m alembic heads 2>/dev/null | tail -1 | cut -d' ' -f1)"

      - name: 2. Incremental upgrade, the shape every real deploy has
        env:
          DATABASE_URL: ${{ env.PG_BASE }}/incremental
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c 'CREATE DATABASE incremental'
          # Separate invocations on purpose. A single `upgrade head` from empty
          # passes even when this is broken, because the baseline creates the
          # enum types in the same run and SQLAlchemy then skips re-creating
          # them. Stopping, committing and upgrading again is what reproduces it.
          python -m alembic upgrade 61801c568bd7
          python -m alembic upgrade head

      - name: 3. Reset cycle — downgrade to base and rebuild
        env:
          DATABASE_URL: ${{ env.PG_BASE }}/incremental
        run: |
          # `cli reset --yes` is exactly this pair. Run it twice: a downgrade
          # that leaks objects fails on the second cycle, not the first.
          for cycle in 1 2; do
            echo "--- cycle $cycle ---"
            python -m alembic downgrade base
            python -m alembic upgrade head
          done

      - name: 4. The models and the migrations agree
        env:
          DATABASE_URL: ${{ env.PG_BASE }}/incremental
        run: |
          python - <<'PY'
          from sqlalchemy import inspect
          from src.db.database import engine
          from src.db.models import Base

          migrated = set(inspect(engine).get_table_names()) - {"alembic_version"}
          declared = set(Base.metadata.tables)

          if migrated != declared:
              print("migrations and models disagree")
              print("  only in migrations:", sorted(migrated - declared))
              print("  only in models:    ", sorted(declared - migrated))
              raise SystemExit(1)
          print(f"{len(declared)} tables, migrations and models agree")
          PY
