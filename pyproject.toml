[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "honest-congress"
version = "0.1.0"
description = "Analyze congressional financial disclosures to detect anomalies and potential inconsistencies"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "python-dotenv>=1.0,<2.0",
    "requests>=2.32,<3.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.0,<7.0",
    "pdfplumber>=0.11,<1.0",
    "jinja2>=3.1,<4.0",
    "pyyaml>=6.0,<7.0",
    # Used directly by src/analysis/significance.py for the permutation null.
    # It used to arrive transitively via yfinance; that dependency is gone, so
    # this is now the only thing keeping numpy installed.
    "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<7.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6.0,<1.0",
    "mypy>=1.10,<2.0",
    "pre-commit>=3.7,<5.0",
    # Stub packages: without these mypy reports import-untyped for requests and
    # yaml, which `ignore_missing_imports` does not suppress (that flag covers
    # libraries with no stubs published at all).
    "types-requests>=2.32,<3.0",
    "types-PyYAML>=6.0,<7.0",
]

[project.scripts]
honest-congress = "src.cli:main"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
src = ["**/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Ruff replaces black + isort + flake8. We keep the rule set narrow on day
# one — pyflakes (F), bugbear (B), pyupgrade (UP), and isort (I) — so the
# baseline lint is meaningful without flooding existing code with style
# nitpicks. Tighten over time.
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "alembic/versions",
]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line too long — formatter handles, and dashboard HTML is wide
    "B008",  # function call in default argument — common with FastAPI Depends()
    "UP006", # `List[...]` -> `list[...]` — defer until 3.11+ enforced
    "UP035", # `typing.List` deprecated — same reason
    "E712",  # `== True` — required idiom for SQLAlchemy boolean column filters
    "E711",  # `== None` — required idiom for SQLAlchemy NULL filters
    "UP042", # str enum variants — refactoring this changes db storage layout
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # asserts in tests are fine

[tool.ruff.format]
quote-style = "double"

# Mypy: strict-optional only, not full strict. We get a real typecheck
# pass against the bits already typed without forcing a top-down annotate-
# everything project.
[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = [
    "alembic/versions",
    "tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/__init__.py", "src/api/routes/dashboard_v2.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
