name: Daily Disclosure Update

on:
  schedule:
    # Run daily at 6 AM UTC (1 AM EST)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger

env:
  PYTHON_VERSION: '3.11'

jobs:
  update-disclosures:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # We point at Railway's external Postgres URL so each daily run
      # ingests into the *same* database the deployed app reads from.
      # Configure the secret in repo settings → Secrets → Actions.
      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: python -m src.cli init

      # `cli ingest` drives IngestionOrchestrator, which covers House Clerk
      # disclosures and the member roster. It does not touch QuiverQuant, so
      # no key is passed here.
      - name: Ingest disclosure data
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          CONGRESS_GOV_API_KEY: ${{ secrets.CONGRESS_GOV_API_KEY }}
        run: python -m src.cli ingest

      - name: Sync committee assignments
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: python -m src.cli sync-committees

      - name: Run anomaly analysis
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: python -m src.cli analyze

      - name: Generate summary report
        run: |
          echo "## Disclosure Update Summary - $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ingestion and analysis completed successfully." >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Daily disclosure update failed. Check logs for details."
