<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Honest Congress{% endblock %}</title>
    <meta name="description" content="Congressional financial disclosures, read from official public sources, with the patterns in them and the limits of what they show.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Honest Congress">
    <meta property="og:title" content="{{ self.title() }}">
    <meta property="og:description" content="Congressional financial disclosures, read from official public sources, with the patterns in them and the limits of what they show.">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pinned: "3.x.x" served whatever unpkg resolved at request time, so a
         new release -- or a compromised one -- reached every visitor unreviewed. -->
    <script src="https://unpkg.com/alpinejs@3.17.4/dist/cdn.min.js" defer></script>
    {% block head_extra %}{% endblock %}
    <style>
        [x-cloak] { display: none !important; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        /* .btn-primary and .btn-secondary lived here, written with @apply.
           That is a build-step Tailwind directive and this page loads the play
           CDN, which ignores it silently -- so both classes rendered as no
           styling at all. Nothing referenced them either. Use the utility
           classes directly, as every template here already does. */
    </style>
</head>
<body class="{% block body_class %}bg-gray-100 min-h-screen{% endblock %}">
    {% block header %}{% include "_partials/header.html" %}{% endblock %}
    {% block content %}{% endblock %}
    {% block footer %}{% include "_partials/footer.html" %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
